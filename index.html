<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Artesanía del Altiplano</title>

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BASE */
body {
    font-family: Arial, sans-serif;
    background: #ffffff;
}

/* CONTENEDOR */
.contenedor {
    width: 100%;
    display: flex;
    justify-content: center;
}

/* IMAGEN */
.portada {
    width: 100%;
    max-width: 500px; /* controla tamaño en PC */
}

.portada img {
    width: 100%;
    height: auto;
    display: block;
}

/* WHATSAPP FLOTANTE */
.whatsapp {
    position: fixed;
    right: 15px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: #25D366;

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow: 0 5px 12px rgba(0,0,0,0.3);
    z-index: 9999;
}

.whatsapp img {
    width: 32px;
    height: 32px;
}

/* POSICIONES */
.whatsapp1 { bottom: 90px; }
.whatsapp2 { bottom: 20px; }

/* CELULAR */
@media (max-width: 768px) {
    .portada {
        max-width: 100%;
    }
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="portada">
        <img src="Fondo5.jpg.png" alt="Artesanía del Altiplano">
    </div>

</div>

<!-- WHATSAPP 1 -->
<a href="https://wa.me/51974250064" class="whatsapp whatsapp1" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<!-- WHATSAPP 2 -->
<a href="https://wa.me/51914856702" class="whatsapp whatsapp2" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

</body>
</html>

</body>
