<style>
* {

    padding: 0;

}

html, body {
    width: 100%;
    min-width: 100%;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
}

.portada {
    width: 100vw;
    max-width: 100vw;
    overflow: hidden;
}

.portada img {
    width: 100vw;
    max-width: 100vw;
    height: auto;

}

.correo {
    width: 100%;
    background-color: #5a2d1f;
    color: white;

.whatsapp-float {

    width: 64px;
    height: 64px;
    background-color: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    z-index: 9999;
}

.whatsapp1 {
    bottom: 95px;
}

.whatsapp2 {
    bottom: 20px;
}

.whatsapp-icon {
    width: 38px;
    height: 38px;
}

@media (max-width: 600px) {
    .portada,
    .portada img {
        width: 100vw;
        max-width: 100vw;
    }

    .correo {
        font-size: 14px;
        padding: 14px 8px;
    }

    .whatsapp-float {
        width: 58px;
        height: 58px;
        right: 14px;
    }

    .whatsapp-icon {
        width: 34px;
        height: 34px;
    }

</style>
</head>
